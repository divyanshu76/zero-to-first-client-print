# ZERO TO FIRST CLIENT — documented editorial changes for the paperback.
#
# Applied by production/scripts/apply_edits.py to source/extracted.html
# (the faithful reconstruction of the original PDF) to produce:
#   source/book_print.html    (paperback interior)
#   source/book_digital.html  (digital PDF edition)
#
# Rules
#   * Each edit names the exact source text (`old`) and how many times it must
#     match (`count`). If the count differs, the build stops: nothing is
#     changed silently.
#   * `edition`: both | print | digital
#   * `status`: proposed edits whose Hindi/Hinglish wording needs the author's
#     confirmation are marked `author_review: true`.
#   * No prompt instruction text is changed by any edit (validated by
#     validate_prompts.py against the original).
#
# Brief §4: remove the "Download Your Resources" section (pp. xi–xii) and every
# instruction that depends on the removed portal https://ztfc-resources.vercel.app/
# or on DOCX/XLSX files that are not part of the printed book.

edits:

  # ------------------------------------------------------------ front matter
  - id: FM-01
    edition: both
    category: resource-removal
    reason: "Brief §4 — remove the two-page 'Download Your Resources' section (original pp. xi–xii, PDF pp. 11–12)."
    op: remove_section
    h1: "Download Your Resources"

  - id: FM-02
    edition: both
    category: navigation
    reason: "Brief §13 — the original Table of Contents carries A4 page numbers and the removed resource page; it is rebuilt from final pagination by the typesetter."
    op: remove_section
    h1: "Table of Contents"

  - id: FM-03
    edition: print
    category: print-accuracy
    reason: "Printed references cannot be clicked. Digital edition keeps the original sentence."
    author_review: true
    old: "<p><strong>5. References.</strong> Text में [1] जैसे numbers Sources section के references से link हैं। PDF में इन पर click कर सकते हैं।</p>"
    new: "<p><strong>5. References.</strong> Text में [1] जैसे numbers book के अंत में दिए Appendix: Sources and Further Reading के references हैं।</p>"
    count: 1

